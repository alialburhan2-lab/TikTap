plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiktap.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tiktap.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No external libraries: pure Android framework for small size and reliable builds.
dependencies {
}
