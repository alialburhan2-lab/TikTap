name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned image that ships with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -eo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at: $SDK"
          if [ ! -d "$SDK" ]; then echo "::error::Android SDK not found at $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > sdk.log 2>&1 \
              || { tail -n 20 sdk.log | sed 's/^/::error::/'; exit 1; }
          else
            echo "::warning::sdkmanager not found; relying on AGP auto-download"
          fi
          ls "$SDK/platforms" || true

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          for f in sdk.log build.log; do
            [ -f "$f" ] || continue
            grep -E "error:|ERROR|What went wrong|FAILURE|Exception|> " "$f" | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          done

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TikTap.apk
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTap-apk
          path: dist/TikTap.apk
          if-no-files-found: error

      - name: Publish to "latest" release (public download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/TikTap.apk \
            --title "TikTap - آخر بناء" \
            --notes "بناء تلقائي من الالتزام ${GITHUB_SHA::7}. ثبّت TikTap.apk على جهاز Android 8.0 أو أحدث." \
            --target "${GITHUB_SHA}"
